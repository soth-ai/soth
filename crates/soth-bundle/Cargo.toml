[package]
name = "soth-bundle"
description = "Verified intelligence bundle loading, validation, and hot-swap"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enables entity_index_from_native, which converts a soth-interface NativeBundle
# into a soth-core EntityIndex.  Off by default so the OSS proxy binary does not
# pull in the proprietary soth-interface crate.
native-bundle = ["dep:soth-interface"]

[dependencies]
soth-core = { workspace = true }
soth-classify = { workspace = true }
soth-policy = { workspace = true }
soth-detect = { workspace = true, default-features = false }
soth-interface = { path = "../../../soth-cloud/crates/soth-interface", optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
rusqlite = { workspace = true }
arc-swap = "1"
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
thiserror = { workspace = true }
hex = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
