[package]
name = "soth-cli"
description = "CLI entry point for SOTH edge proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "soth"

[[bin]]
name = "soth"
path = "src/main.rs"

[features]
default = []
local-debug = []
dev-pipeline-trace = ["soth-proxy/dev-pipeline-trace"]

[dependencies]
soth-core = { workspace = true }
soth-bundle = { workspace = true }
soth-proxy = { workspace = true }
soth-extensions = { workspace = true }
soth-historian = { workspace = true }
soth-sync = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
rcgen = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
toml = "0.8"
hex = "0.4"
dirs = "5.0"
which = "6.0"
libc = "0.2"

# CLI styling
owo-colors = "4.0"
comfy-table = "7.0"

[dev-dependencies]
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
