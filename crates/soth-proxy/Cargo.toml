[package]
name = "soth-proxy"
description = "Transport handling and request pipeline for SOTH"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["dashboard"]
dashboard = ["dep:soth-dashboard"]

[dependencies]
soth-core = { workspace = true }
soth-registry = { workspace = true }
soth-identity = { workspace = true }
soth-policy = { workspace = true }
soth-observe = { workspace = true }
soth-budget = { workspace = true }
soth-dashboard = { workspace = true, optional = true }
soth-tls = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
hudsucker = { version = "0.24.0", features = ["http2", "rcgen-ca", "rustls-client"] }
rustls-pemfile = "2"
flate2 = "1.0"
brotli = "7"
zstd = "0.13"
rmcp = "0.14.0"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "layer_microbench"
harness = false
