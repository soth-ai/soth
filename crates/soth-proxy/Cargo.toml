[package]
name = "soth-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["extensions"]
dev-pipeline-trace = []
extensions = ["dep:soth-extensions"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
once_cell.workspace = true
arc-swap = "1"
async-trait.workspace = true
axum.workspace = true
bytes = "1"
libc = "0.2"
chrono.workspace = true
dashmap.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
hex = "0.4"
hmac = "0.12"
rand.workspace = true
reqwest.workspace = true
flate2 = { workspace = true }
tar = { workspace = true }
zeroize = { workspace = true }
http = "1"
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true

# Observability stack (see docs/common/observability.md)
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-semantic-conventions.workspace = true
tracing-opentelemetry.workspace = true
sentry.workspace = true
uuid.workspace = true

soth-core = { workspace = true }
soth-bundle = { workspace = true }
soth-detect = { workspace = true, features = ["tree-sitter-code", "intelligence", "intelligence-sqlite"] }
soth-parse = { workspace = true }
soth-classify = { workspace = true, features = ["policy", "onnx-models"] }
sqlite-vec = "0.1"
soth-telemetry = { workspace = true }
soth-policy = { workspace = true }
soth-sync = { workspace = true }

soth-extensions = { workspace = true, optional = true }
soth-mitm = "0.3.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
