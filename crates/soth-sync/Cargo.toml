[package]
name = "soth-sync"
description = "Edge-side cloud sync plumbing for SOTH"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
soth-core = { workspace = true }
soth-bundle = { workspace = true, features = ["native-bundle"] }
soth-interface = { path = "../../../soth-cloud/crates/soth-interface" }
soth-telemetry = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart"] }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
rusqlite = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
uuid = { workspace = true, features = ["v5"] }
rand = { workspace = true }
flate2 = "1.0"
ed25519-dalek = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
