[package]
name = "soth-classify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true

[features]
# Default ON for the proxy and native (PyO3 / napi-rs) SDK bindings: full local
# embedding via ONNX Runtime. Disable (`--no-default-features`) for WASM /
# size-constrained targets — see Phase 2 of the SDK plan for the cloud-classify
# fallback contract. When `onnx-models` is OFF, the bundle's `onnx_runtime` is
# always `None` and stage1 falls back to the deterministic hash embedding.
default = ["onnx-models"]
onnx-models = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
policy = ["dep:soth-policy"]

[dependencies]
soth-core = { workspace = true }
soth-policy = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
toml = "0.8"
ndarray = { version = "0.16", optional = true }
ort = { version = "2.0.0-rc.9", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }

[dev-dependencies]
criterion = "0.5"
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "classify_bench"
harness = false
