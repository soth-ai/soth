[package]
name = "soth-detect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Default keeps the trait + helpers (no native deps) so wasm32 / SDK consumers
# can build with `--no-default-features` and still get parse-quality bookkeeping
# via `NoopBackend` / `InMemoryBackend`. The proxy opts into native deps via
# `tree-sitter-code` and `intelligence-sqlite`.
default = ["intelligence"]
# In-memory + Noop backends for the IntelligenceSink trait. Adds no native deps.
intelligence = []
# Persistent SQLite-backed IntelligenceSink (`IntelligenceStore`, replay tooling).
# Pulls rusqlite (C dep) — incompatible with wasm32; required by the proxy.
intelligence-sqlite = ["intelligence", "dep:rusqlite"]
# Tree-sitter AST analysis for code artifacts. Without this feature, code.rs
# falls back to heuristic-only analysis (regex import extraction, regex function
# count). Pulls native C parsers — incompatible with wasm32 (today).
tree-sitter-code = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
]

[dependencies]
soth-core = { workspace = true }
soth-parse = { workspace = true }
base64 = { workspace = true }
bytes = "1"
lru = "0.12"
graphql-parser = "0.4"
tree-sitter = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
once_cell = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
criterion = "0.5"
soth-core = { workspace = true }
soth-bundle = { workspace = true }

[[bench]]
name = "intelligence_bench"
harness = false
required-features = ["intelligence-sqlite"]
