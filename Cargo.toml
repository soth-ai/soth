[workspace]
resolver = "2"
members = [
    "crates/soth-core",
    "crates/soth-helper",
    "crates/soth-crypto",
    "crates/soth-policy",
    "crates/soth-observe",
    "crates/soth-budget",
    "crates/soth-collector",
    "crates/soth-dashboard",
    "crates/soth-cli",
    "crates/soth-sync",
    "crates/soth-edge",
    "crates/soth-wrap",
]
default-members = [
    "crates/soth-core",
    "crates/soth-helper",
    "crates/soth-crypto",
    "crates/soth-policy",
    "crates/soth-observe",
    "crates/soth-budget",
    "crates/soth-collector",
    "crates/soth-cli",
    "crates/soth-sync",
    "crates/soth-edge",
    "crates/soth-wrap",
]
exclude = [
    "tests/tools/mock_mcp_server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/labterminal/soth"
authors = ["Labterminal"]

[workspace.dependencies]
# Internal crates
soth-core = { path = "crates/soth-core" }
soth-helper = { path = "crates/soth-helper" }
soth-crypto = { path = "crates/soth-crypto" }
soth-policy = { path = "crates/soth-policy" }
soth-observe = { path = "crates/soth-observe" }
soth-budget = { path = "crates/soth-budget" }
soth-collector = { path = "crates/soth-collector" }
soth-dashboard = { path = "crates/soth-dashboard" }
soth-sync = { path = "crates/soth-sync" }
soth-edge = { path = "crates/soth-edge" }
soth-wrap = { path = "crates/soth-wrap" }

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "sync",
    "fs",
    "time",
    "process",
    "io-util",
    "io-std",
] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
bs58 = "0.5"
rand = "0.8"
base64 = "0.22"

# Policy (OPA Wasm)
wasmtime = "17"

# HTTP/Proxy
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "gzip",
] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
tokio-tungstenite = "0.21"

# TLS
rcgen = "0.13"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
x509-parser = "0.16"
webpki-roots = "0.26"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
once_cell = "1"
dashmap = "5"
parking_lot = "0.12"
dirs = "5"

# Metrics/Monitoring
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Testing
tempfile = "3"

# File watching
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false

[profile.bench]
inherits = "release"
debug = 1
strip = "none"
lto = "thin"
codegen-units = 1
incremental = false

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
lto = "off"
codegen-units = 16
incremental = false
