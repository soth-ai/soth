[workspace]
resolver = "2"
members = [
    "crates/soth-cli",
    "crates/soth-core",
    "crates/soth-api-types",
    "crates/soth-bundle",
    "crates/soth-classify",
    "crates/soth-conformance-tests",
    "crates/soth-proxy",
    "crates/soth-sdk-core",
    "crates/soth-telemetry",
    "crates/soth-policy",
    "crates/soth-sync",
    "crates/soth-parse",
    "crates/soth-detect",
    "crates/soth-extensions",
    "extensions/historian",
    "extensions/code",
    "bindings/soth-py",
    "bindings/soth-node",
]
default-members = [
    "crates/soth-cli",
    "crates/soth-core",
    "crates/soth-bundle",
    "crates/soth-classify",
    "crates/soth-proxy",
    "crates/soth-telemetry",
    "crates/soth-policy",
    "crates/soth-sync",
    "crates/soth-extensions",
]
# Bindings (soth-py, soth-node) are explicitly NOT in default-members:
# they require Python / Node toolchains and produce cdylibs that the
# rest of the workspace doesn't link against. Build them via
# `cargo build -p soth-py` / `cargo build -p soth-node` or via the
# language-level tooling (maturin / @napi-rs/cli).
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/labterminal/soth"
authors = ["Labterminal"]

[workspace.dependencies]
# Internal crates
soth-core = { path = "crates/soth-core" }
soth-api-types = { path = "crates/soth-api-types" }
soth-bundle = { path = "crates/soth-bundle" }
# Default features OFF at the workspace level so the WASM SDK target
# can build without ONNX. Consumers that want local classification
# (the proxy, native bindings) opt back in via `features =
# ["onnx-models", ...]` on their own dep entries — same pattern as
# `soth-detect` above.
soth-classify = { path = "crates/soth-classify", default-features = false }
soth-proxy = { path = "crates/soth-proxy" }
soth-telemetry = { path = "crates/soth-telemetry" }
soth-policy = { path = "crates/soth-policy" }
soth-sync = { path = "crates/soth-sync" }
soth-parse = { path = "crates/soth-parse" }
soth-detect = { path = "crates/soth-detect", default-features = false }
soth-extensions = { path = "crates/soth-extensions" }
soth-historian = { path = "extensions/historian" }
soth-code = { path = "extensions/code" }

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "sync",
    "fs",
    "time",
    "process",
    "io-util",
    "io-std",
] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1", features = ["derive", "serde"] }

# HTTP
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "gzip",
] }

# TLS
rcgen = "0.13"
rustls = "0.23"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Observability — phase 1: edge proxy → Honeycomb (OTLP/HTTP) + Sentry for
# panics + ERROR-level events. See docs/common/observability.md.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = "0.28"
sentry = { version = "0.34", default-features = false, features = ["panic", "tracing", "transport", "reqwest", "rustls", "backtrace", "contexts"] }
once_cell = "1"
dashmap = "5"
dirs = "5"

# Testing
tempfile = "3"

# File watching
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

# Compression / archive
flate2 = "1"
tar = "0.4"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false

[profile.bench]
inherits = "release"
debug = 1
strip = "none"
lto = "thin"
codegen-units = 1
incremental = false

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
lto = "off"
codegen-units = 16
incremental = false
