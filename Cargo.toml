[workspace]
resolver = "2"
members = [
    "crates/soth-cli",
    "crates/soth-core",
    "crates/soth-bundle",
    "crates/soth-classify",
    "crates/soth-sqlite-vec",
    "crates/soth-proxy",
    "crates/soth-telemetry",
    "crates/soth-policy",
    "crates/soth-sync",
    "crates/soth-parse",
    "crates/soth-detect",
    "crates/soth-extensions",
    "extensions/historian",
]
default-members = [
    "crates/soth-cli",
    "crates/soth-core",
    "crates/soth-bundle",
    "crates/soth-classify",
    "crates/soth-proxy",
    "crates/soth-telemetry",
    "crates/soth-policy",
    "crates/soth-sync",
    "crates/soth-extensions",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/labterminal/soth"
authors = ["Labterminal"]

[workspace.dependencies]
# Internal crates
soth-core = { path = "crates/soth-core" }
soth-bundle = { path = "crates/soth-bundle" }
soth-classify = { path = "crates/soth-classify" }
soth-sqlite-vec = { path = "crates/soth-sqlite-vec" }
soth-proxy = { path = "crates/soth-proxy" }
soth-telemetry = { path = "crates/soth-telemetry" }
soth-policy = { path = "crates/soth-policy" }
soth-sync = { path = "crates/soth-sync" }
soth-parse = { path = "crates/soth-parse" }
soth-detect = { path = "crates/soth-detect", default-features = false }
soth-extensions = { path = "crates/soth-extensions" }
soth-historian = { path = "extensions/historian" }

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "sync",
    "fs",
    "time",
    "process",
    "io-util",
    "io-std",
] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# HTTP
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "gzip",
] }

# TLS
rcgen = "0.13"
rustls = "0.23"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
once_cell = "1"
dashmap = "5"
dirs = "5"

# Testing
tempfile = "3"

# File watching
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false

[profile.bench]
inherits = "release"
debug = 1
strip = "none"
lto = "thin"
codegen-units = 1
incremental = false

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
lto = "off"
codegen-units = 16
incremental = false
