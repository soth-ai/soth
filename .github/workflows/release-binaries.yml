name: release-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: soth-darwin-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            asset_name: soth-darwin-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: soth-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: soth-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Install AArch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user libc6-arm64-cross

      - name: Install Rosetta for x86_64 macOS smoke
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          if pgrep oahd >/dev/null 2>&1; then
            echo "Rosetta already installed"
          else
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: sqlite-vec smoke test (native targets)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'x86_64-apple-darwin'
        run: cargo test -p soth-proxy --test sqlite_vec_smoke --release --target "${{ matrix.target }}"

      - name: sqlite-vec smoke test (x86_64 macOS via Rosetta)
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          CARGO_TARGET_X86_64_APPLE_DARWIN_RUNNER: arch -x86_64
        run: cargo test -p soth-proxy --test sqlite_vec_smoke --release --target "${{ matrix.target }}"

      - name: sqlite-vec smoke test (aarch64 Linux via qemu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: cargo test -p soth-proxy --test sqlite_vec_smoke --release --target "${{ matrix.target }}"

      - name: Build sensor binary (native + non-aarch64-linux targets)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build -p soth-cli --bin soth --release --target "${{ matrix.target }}"

      - name: Build sensor binary (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p soth-cli --bin soth --release --target "${{ matrix.target }}"

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/soth" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"
          shasum -a 256 "dist/${{ matrix.asset_name }}" > "dist/${{ matrix.asset_name }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: soth-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/soth-darwin-arm64
            dist/soth-darwin-arm64.sha256
            dist/soth-darwin-amd64
            dist/soth-darwin-amd64.sha256
            dist/soth-linux-arm64
            dist/soth-linux-arm64.sha256
            dist/soth-linux-amd64
            dist/soth-linux-amd64.sha256
