name: ci

on:
  pull_request:
    # Skip CI on PRs that only touch docs / markdown — saves a full
    # workflow run per readme tweak. The ignore filter is path-based:
    # any code/config change still triggers everything.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  push:
    # Add `staging` so direct pushes (cargo-fmt fixups, ops tweaks)
    # get verified — `staging` is a real merge target, not just a
    # branch name.
    branches: [main, staging]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'

# Cancel superseded runs on the same ref. Push-rebase-push cycles on
# an open PR were burning duplicate minutes; only the latest commit's
# run is load-bearing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt runs first; the other three Linux jobs `needs: fmt`. A syntax-
  # error PR that fails fmt no longer pays for a full clippy + test
  # run — fmt is ~30s, the rest is 5-10min each. Wall-clock for
  # passing PRs is unchanged (clippy + test run in parallel after
  # fmt's 30s; fmt isn't on the critical path).
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --lib --bins --tests

  test:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --bins

  # Path-gate filter for test-windows: list crates whose code paths
  # actually differ on Windows (path resolution, settings.json install
  # location, regex / unicode, signature-verify) plus the Phase 4b
  # sidecar updater. Most PRs against staging touch proxy / sync / cli
  # surface that's Linux-equivalent, so this skips test-windows on
  # ~80% of PRs.
  #
  # Windows runners bill at 2x Linux rate; this is the single biggest
  # CI-minute lever in the repo. Skipping it unconditionally would
  # let macOS 26 / Windows regressions land on main before CI catches
  # them (gryph PR #42 was exactly this regression). The path filter
  # keeps the safety net where it matters.
  changes:
    runs-on: ubuntu-latest
    needs: fmt
    outputs:
      windows_relevant: ${{ steps.filter.outputs.windows_relevant }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            windows_relevant:
              - 'crates/soth-core/**'
              - 'crates/soth-classify/**'
              - 'crates/soth-detect/**'
              - 'crates/soth-policy/**'
              - 'crates/soth-bundle/**'
              - 'crates/soth-extensions/**'
              - 'crates/soth-parse/**'
              - 'crates/soth-cli/src/update/**'
              - 'crates/soth-cli-update-sidecar/**'
              - 'extensions/code/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  # Parser / detect / policy / install tests on Windows — gryph
  # PR #42's `unzip` Windows-specific bug shipped because there
  # was no Windows runner in CI. We do ship Windows soth-cli
  # binaries (see node-binaries.yml release lane), so any
  # Windows-only regression in parser/detect/policy/install code
  # paths must land on a real Windows runner before merge.
  #
  # Now gated on `changes.outputs.windows_relevant` (see above)
  # so PRs that don't touch Windows-divergent crates skip it.
  # Scoped to library tests for the crates whose code paths
  # actually differ on Windows. soth-proxy is excluded — its async
  # networking surface includes Linux-specific syscalls (epoll,
  # AF_UNIX) that don't compile on Windows and are not the
  # historical regression site.
  test-windows:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.windows_relevant == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: lib tests on Windows
        shell: bash
        run: |
          cargo test --lib -p soth-core
          cargo test --lib -p soth-classify
          cargo test --lib -p soth-detect
          cargo test --lib -p soth-policy
          cargo test --lib -p soth-bundle
          cargo test --lib -p soth-extensions
          cargo test --lib -p soth-parse
          cargo test --lib -p soth-code

  # SDK-related jobs (conformance / wasm matrix / bindings-build-check) are
  # intentionally NOT in this workflow.
  #
  # They live in dedicated workflows that are already path-filtered to fire
  # only when the SDK surface or bindings actually change:
  #   - ffi-conformance.yml   (bindings + sdk-core fixtures)
  #   - python-wheels.yml     (bindings/soth-py + sdk-core)
  #   - node-binaries.yml     (bindings/soth-node + sdk-core)
  #
  # Keeping the basic CI lane (fmt + clippy + test) lean speeds up review
  # for the proxy/historian/cli changes that are >90% of PRs against
  # staging. The dedicated workflows still run on the relevant paths and
  # on push to main / sdk-* branches as a release gate.
