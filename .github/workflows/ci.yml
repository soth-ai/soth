name: ci

on:
  pull_request:
    # Skip CI on PRs that only touch docs / markdown — saves a full
    # workflow run per readme tweak. The ignore filter is path-based:
    # any code/config change still triggers everything.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  push:
    # `staging` is a real merge target; pushes to it (cargo-fmt fixups,
    # ops tweaks) get the same fmt + clippy + test verification PRs do.
    # `main` is the release line — heavy lanes (Windows, conformance,
    # bindings matrices) trigger from release-ci.yml on tag push.
    branches: [main, staging]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'

# Cancel superseded runs on the same ref. Push-rebase-push cycles on
# an open PR were burning duplicate minutes; only the latest commit's
# run is load-bearing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Per-PR lane is intentionally minimal: fmt + clippy + test on Linux
# only. Windows tests, FFI conformance, and the per-arch
# bindings/wheel matrices all live under release-ci.yml and fire on
# release tags (`v*`) — they're release-gate signal, not per-PR
# signal, and they dominate the CI-minute budget when run on every
# push. See release-ci.yml for the full list.
jobs:
  # fmt runs first; clippy + test `needs: fmt`. A syntax-error PR
  # that fails fmt no longer pays for a full clippy + test run —
  # fmt is ~30s, the rest is 5-10min each.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --lib --bins --tests

  test:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --bins
